name: PHP Composer
on: [push]
jobs:
  psalm:
    name: Psalm Static Analysis 
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['8.4', '8.5']
        composer-deps:
          - stable
    steps:
    - uses: actions/checkout@v2

    - name: Install PHP ${{ matrix.php-versions }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        tools: composer:v2

    - name: Install dependencies
      run: composer update --prefer-${{ matrix.composer-deps }} --prefer-dist --no-interaction

    - name: Install Psalm
      run: make psalm-install

    - name: Run Psalm
      run: make psalm
            
  phpunit_infection:
    name: PHPUnit + Infection (PHP ${{ matrix.php-versions }}, Composer ${{ matrix.composer-versions }} --prefer-${{ matrix.composer-deps }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.php-versions == '8.0' }}
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"
    strategy:
      matrix:
        php-versions: ['8.4', '8.5']
        composer-deps:
          - stable
          - lowest

    steps:
    - uses: actions/checkout@v2

    - name: Install PHP ${{ matrix.php-versions }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        tools: composer:v2

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Install dependencies
      run: composer install --prefer-${{ matrix.composer-deps }} --prefer-dist --no-interaction

    - name: Run unit tests
      run: vendor/bin/phpunit

    - name: Run Infection
      run: vendor/bin/infection
